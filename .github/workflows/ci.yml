# Goal -  I have to lint, build , test the code for frontend and backend, then push the images to docker hub

name: CI   

on:
  push: 
    branches: [follow-tutor]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
         - name: Checkout code
           uses: actions/checkout@v7

         - name: Frontend Linter 
           uses: actions/setup-node@v6
           with:
            node-version: '20'
            cache: npm
            cache-dependency-path: frontend\package-lock.json

         - name: Install npm Packages 
           run: npm install

         - name: Run Linter
           run: npm run lint

         - name: Run Tests
           run: npm run test 



